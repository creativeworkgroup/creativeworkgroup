<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Creative Workgroup — Mail Console</title>

<style>
:root {
    --bg: #0f172a;
    --card: #1e293b;
    --border: #334155;
    --text: #f8fafc;
    --muted: #94a3b8;
    --accent: #3b82f6;
    --accent-hover: #2563eb;
    --success: #22c55e;
    --danger: #ef4444;
}

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 20px;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
}

.container {
    width: 100%;
    max-width: 850px;
    margin: 0 auto;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 30px;
    box-shadow: 0 10px 25px rgba(0,0,0,.3);
}

h2 {
    margin-top: 0;
    font-size: 1.3rem;
    letter-spacing: .04em;
    border-bottom: 1px solid var(--border);
    padding-bottom: 15px;
    color: #38bdf8;
}

.form-group {
    margin-bottom: 20px;
}

label {
    display: block;
    margin-bottom: 8px;
    font-size: .82rem;
    font-weight: 600;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: .05em;
}

input,
textarea {
    width: 100%;
    padding: 11px 12px;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 7px;
    color: var(--text);
    font-size: .95rem;
}

textarea {
    resize: vertical;
    min-height: 110px;
    font-family: inherit;
}

input:focus,
textarea:focus {
    outline: none;
    border-color: var(--accent);
}

.section-title {
    margin: 28px 0 15px;
    font-size: .95rem;
    font-weight: 700;
    color: #38bdf8;
    text-transform: uppercase;
    letter-spacing: .06em;
}

.variant {
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 18px;
    margin-bottom: 15px;
    background: rgba(15, 23, 42, .55);
}

.variant-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 14px;
}

.variant-number {
    font-weight: 700;
    color: var(--text);
}

.variant-badge {
    font-size: .72rem;
    color: var(--muted);
}

button {
    width: 100%;
    padding: 13px;
    background: var(--accent);
    color: white;
    border: none;
    border-radius: 7px;
    cursor: pointer;
    font-size: 1rem;
    font-weight: bold;
    margin-top: 8px;
}

button:hover {
    background: var(--accent-hover);
}

button:disabled {
    background: var(--border);
    cursor: not-allowed;
}

.stats-box {
    margin-top: 25px;
    border-top: 1px solid var(--border);
    padding-top: 20px;
}

.stats-row {
    display: flex;
    justify-content: space-between;
    gap: 15px;
    margin-bottom: 10px;
    font-size: .95rem;
}

.results-list {
    margin-top: 15px;
    max-height: 350px;
    overflow-y: auto;
    border: 1px solid var(--border);
    border-radius: 7px;
    background: var(--bg);
    padding: 10px;
}

.result-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    padding: 9px 8px;
    border-bottom: 1px solid var(--card);
    font-size: .84rem;
}

.result-item:last-child {
    border-bottom: none;
}

.result-email {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}

.tag-sent {
    color: var(--success);
    font-weight: bold;
    white-space: nowrap;
}

.tag-failed {
    color: var(--danger);
    font-weight: bold;
    white-space: nowrap;
}

.variant-result {
    color: var(--muted);
    white-space: nowrap;
}
</style>
</head>

<body>

<div class="container">

    <h2>Creative Workgroup Mail</h2>

    <div class="form-group">
        <label>Send From</label>

        <div id="senderPool"></div>

        <button
            type="button"
            id="addSenderBtn"
            style="width:auto;padding:10px 16px;margin-top:10px;"
            onclick="addSender()"
        >
            ＋ ADD SENDER
        </button>
    </div>

    <div class="form-group">
</div>

    <div class="section-title">Email Variants</div>

    <div id="variants"></div>

    <div style="display:flex;justify-content:flex-end;margin:14px 0 10px;">
        <button
            type="button"
            id="addVariantBtn"
            style="width:auto;padding:10px 16px;"
            onclick="addVariant()"
        >
            ＋ ADD SUBJECT & EMAIL
        </button>
    </div>

    <div class="section-title">Recipients</div>

    <div class="form-group">
        <label>Send To — One Recipient Per Line</label>
        <textarea
            id="sendTo"
            placeholder="customer1@gmail.com
customer2@gmail.com
customer3@gmail.com"></textarea>
    </div>

    <button id="sendBtn" type="button" onclick="startSending()">
        SEND EMAILS
    </button>

    <div class="stats-box" id="statsSection" style="display:none;">

        <div class="stats-row" id="sendingProgress">
            <strong>Status:</strong>

        </div>

        <div class="stats-row">
            <span>

            </span>

            <span>
                Not Sent:
                <strong id="notSentCount" style="color:var(--danger)">0</strong>
            </span>
        </div>

        <div class="results-list" id="resultsList"></div>

    </div>

</div>

defaultVariants.forEach((item, index) => {
    const i = index + 1;
    const variant = document.createElement("div");

    variant.className = "variant";

    variant.innerHTML = `
        <div class="variant-header">

function addVariant() {
    const container = document.getElementById("variants");

    const card = document.createElement("div");
    card.className = "variant-card";

    card.innerHTML = `
        <div style="display:flex;justify-content:space-between;align-items:center;">
            <strong>New Variant</strong>
            <button
                type="button"
                onclick="this.closest('.variant-card').remove(); renumberVariants();"
                style="width:auto;padding:6px 10px;"
            >
                DELETE
            </button>
        </div>

        <label>Subject</label>
        <input
            type="text"
            class="variant-subject"
            placeholder="Email subject"
        >

        <label>Email</label>
        <textarea
            class="variant-body"
            placeholder="Email body"
        ></textarea>
    `;

    container.appendChild(card);
    renumberVariants();
}

function renumberVariants() {
    document.querySelectorAll("#variants .variant-card").forEach((card, index) => {
        const title = card.querySelector("strong");
        if (title) {
            title.textContent = `Variant ${index + 1}`;
        }
    });
}

function getVariants() {
    const variants = [];

    for (let i = 1; i <= 5; i++) {
        const subject = document
            .getElementById(`subject${i}`)
            .value
            .trim();

        const body = document
            .getElementById(`body${i}`)
            .value;

        if (subject || body.trim()) {
            variants.push({
                subject,
                body
            });
        }
    }

    return variants;
}

function renderResults(results) {
    const list = document.getElementById("resultsList");

    list.innerHTML = "";

    results.forEach(result => {
        const item = document.createElement("div");

        item.className = "result-item";

        const email = document.createElement("span");
        email.className = "result-email";
        email.textContent = result.email;

        const variant = document.createElement("span");
        variant.className = "variant-result";
        variant.textContent = `V${result.variant}`;

        const status = document.createElement("span");
        status.className =
            result.status === "Sent"
                ? "tag-sent"
                : "tag-failed";

        status.textContent = result.status;

        item.appendChild(email);
        item.appendChild(variant);
        item.appendChild(status);

        list.appendChild(item);
    });
}


let mailQueue = null;
let queueRunning = false;
let queuePaused = false;
let queueStopped = false;
let queueCountdownTimer = null;

function ensureQueueControls() {
    if (document.getElementById("queueControls")) return;

    const sendBtn = document.getElementById("sendBtn");

    const controls = document.createElement("div");
    controls.id = "queueControls";
    controls.style.cssText = `
        display:flex;
        gap:10px;
        margin-top:12px;
        flex-wrap:wrap;
    `;

    controls.innerHTML = `
        <button type="button" id="playQueueBtn">▶ PLAY</button>
        <button type="button" id="pauseQueueBtn">⏸ PAUSE</button>
        <button type="button" id="stopQueueBtn">■ STOP</button>
    `;

    sendBtn.parentNode.insertBefore(controls, sendBtn.nextSibling);

    document.getElementById("playQueueBtn").addEventListener("click", async () => {
        if (!mailQueue) {
            startSending();
            return;
        }

        if (queueRunning || !queuePaused || queueStopped) return;

        queuePaused = false;
        queueStopped = false;
        updateQueueControls();
        await processQueue();
    });

    document.getElementById("pauseQueueBtn").addEventListener("click", () => {
        if (!mailQueue || !queueRunning) return;

        queuePaused = true;
        queueRunning = false;
        clearInterval(queueCountdownTimer);

        updateQueueStatus("Paused — press PLAY to continue");
        updateQueueControls();
    });

    document.getElementById("stopQueueBtn").addEventListener("click", () => {
        if (!mailQueue) return;

        queueStopped = true;
        queuePaused = false;
        queueRunning = false;
        clearInterval(queueCountdownTimer);

        updateQueueStatus(
            `Stopped — ${mailQueue.index} / ${mailQueue.recipients.length} processed`
        );

        updateQueueControls();
    });

    updateQueueControls();
}

function updateQueueControls() {
    const play = document.getElementById("playQueueBtn");
    const pause = document.getElementById("pauseQueueBtn");
    const stop = document.getElementById("stopQueueBtn");

    if (!play || !pause || !stop) return;

    if (!mailQueue) {
        play.disabled = false;
        pause.disabled = true;
        stop.disabled = true;
        return;
    }

    play.disabled = queueRunning || queueStopped;
    pause.disabled = !queueRunning;
    stop.disabled = queueStopped || mailQueue.index >= mailQueue.recipients.length;
}

function updateQueueStatus(message) {
    const progress = document.getElementById("sendingProgress");

    if (!mailQueue) return;

    const total = mailQueue.recipients.length;
    const processed = mailQueue.index;
    const remaining = Math.max(total - processed, 0);

    progress.innerHTML = `
        <strong>Status:</strong>
        <span>
            SENT ${mailQueue.sent} / ${total}
            &nbsp;•&nbsp;
            FAILED ${mailQueue.failed}
            &nbsp;•&nbsp;
            REMAINING ${remaining}
        </span>
        <br>
        <span>${message}</span>
    `;
}

function addQueueResult(result) {
    mailQueue.results.push(result);

    const resultsList = document.getElementById("resultsList");
    resultsList.innerHTML = "";

    mailQueue.results.forEach(result => {
        const item = document.createElement("div");
        item.className = "result-item";

        const email = document.createElement("span");
        email.className = "result-email";
        email.textContent = result.email;

        const variant = document.createElement("span");
        variant.className = "variant-result";
        variant.textContent =
            result.variant === "—"
                ? "—"
                : `V${result.variant}`;

        const status = document.createElement("span");
        status.className =
            result.status === "Sent"
                ? "tag-sent"
                : "tag-failed";
        status.textContent = result.status;

        item.appendChild(email);
        item.appendChild(variant);
        item.appendChild(status);

        if (result.status !== "Sent" && result.error) {
            const error = document.createElement("span");
            error.className = "result-error";
            error.textContent =
                typeof result.error === "string"
                    ? result.error
                    : JSON.stringify(result.error);
            item.appendChild(error);
        }

        resultsList.appendChild(item);
    });
}

async function waitTenSeconds() {
    for (let seconds = 10; seconds > 0; seconds--) {
        if (!mailQueue || queueStopped) return false;

        while (queuePaused && !queueStopped) {
            updateQueueStatus("Paused — press PLAY to continue");
            await new Promise(resolve => setTimeout(resolve, 250));
        }

        if (queueStopped) return false;

        updateQueueStatus(`Next email in ${seconds} seconds...`);

        await new Promise(resolve => setTimeout(resolve, 1000));
    }

    return !queueStopped;
}

async function processQueue() {
    if (!mailQueue || queueRunning || queueStopped) return;

    queueRunning = true;
    queuePaused = false;
    updateQueueControls();

    const {
        variants,
        recipients
    } = mailQueue;

    try {
        while (
            mailQueue.index < recipients.length &&
            !queueStopped
        ) {
            while (queuePaused && !queueStopped) {
                queueRunning = false;
                updateQueueStatus("Paused — press PLAY to continue");
                updateQueueControls();

                await new Promise(resolve => setTimeout(resolve, 250));

                if (!queuePaused && !queueStopped) {
                    queueRunning = true;
                    updateQueueControls();
                }
            }

            if (queueStopped) break;

            const recipient = recipients[mailQueue.index];

            updateQueueStatus(
                `Sending ${mailQueue.index + 1} / ${recipients.length} — ${recipient}`
            );

            try {
                const response = await fetch("/api/send", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        sender: getNextSender(),
                        to: [recipient],
                        variants
                    })
                });

                const data = await response.json();

                if (data.sender_failed && data.sender_id) {
                    markSenderDead(data.sender_id);

                    const deadSender = senderPool.find(
                        sender => sender.id === data.sender_id
                    );

                    updateQueueStatus(
                        `Sender ${deadSender?.email || "unknown"} marked DEAD — continuing`
                    );

                    mailQueue.failed++;

                    addQueueResult({
                        email: recipient,
                        status: "Failed",
                        variant:
                            data.results &&
                            data.results.length &&
                            data.results[0].variant
                                ? data.results[0].variant
                                : "—",
                        error:
                            data.error ||
                            (
                                data.results &&
                                data.results.length
                                    ? data.results[0].error
                                    : "Sender failed"
                            ),
                        sender: data.sender,
                        provider: data.provider,
                        sender_failed: true
                    });

                    mailQueue.index++;
                    continue;
                }

                const result =
                    data.results && data.results.length
                        ? data.results[0]
                        : null;

                if (!response.ok || !result) {
                    throw new Error(
                        typeof data.error === "string"
                            ? data.error
                            : JSON.stringify(data.error || data)
                    );
                }

                addQueueResult(result);

                if (result.status === "Sent") {
                    mailQueue.sent++;
                } else {
                    mailQueue.failed++;
                }

            } catch (error) {
                mailQueue.failed++;

                addQueueResult({
                    email: recipient,
                    status: "Failed",
                    variant: "—",
                    error: error.message || String(error)
                });
            }

            mailQueue.index++;

            document.getElementById("sentCount").textContent =
                mailQueue.sent;

            document.getElementById("notSentCount").textContent =
                mailQueue.failed;

            updateQueueStatus(
                `Completed ${mailQueue.index} / ${recipients.length}`
            );

            if (
                mailQueue.index < recipients.length &&
                !queueStopped
            ) {
                const completed = await waitTenSeconds();

                if (!completed) break;
            }
        }

        if (queueStopped) {
            updateQueueStatus(
                `Stopped — ${mailQueue.index} / ${recipients.length} processed`
            );
            return;
        }

        if (mailQueue.index >= recipients.length) {
            updateQueueStatus(
                `Completed — ${recipients.length} processed`
            );

            document.getElementById("sendTo").value = "";

            queueRunning = false;
            queuePaused = false;

            updateQueueControls();
        }

    } finally {
        queueRunning = false;
        updateQueueControls();
    }
}


const SENDER_STORAGE_KEY = "creativeworkgroup_sender_pool";

let senderPool = [];

function loadSenders() {
    try {
        const saved = JSON.parse(
            localStorage.getItem(SENDER_STORAGE_KEY) || "[]"
        );

        if (Array.isArray(saved) && saved.length) {
            return saved;
        }
    } catch (_) {}

    return [{
        id: crypto.randomUUID(),
        name: "Ashley Mok",
        email: "info@creativeworkgroup.org",
        provider: "cloudflare",
        status: "active"
    }];
}

senderPool = loadSenders();

function saveSenders() {
    localStorage.setItem(
        SENDER_STORAGE_KEY,
        JSON.stringify(senderPool)
    );
}

function renderSenders() {
    const container = document.getElementById("senderPool");
    if (!container) return;

    container.innerHTML = "";

    senderPool.forEach((sender, index) => {
        const row = document.createElement("div");

        row.style.cssText =
            "border:1px solid var(--border,#ddd);" +
            "border-radius:10px;padding:10px;margin-bottom:10px;";

        const fields = document.createElement("div");

        fields.style.cssText =
            "display:grid;" +
            "grid-template-columns:1fr 1fr 150px auto;" +
            "gap:8px;align-items:center;";

        fields.innerHTML = `
            <input
                type="text"
                value="${escapeHtml(sender.name)}"
                placeholder="Sender name"
                onchange="updateSender(${index}, 'name', this.value)"
            >

            <input
                type="email"
                value="${escapeHtml(sender.email)}"
                placeholder="sender@example.com"
                onchange="updateSender(${index}, 'email', this.value)"
            >

            <select onchange="updateSender(${index}, 'provider', this.value)">
                <option value="cloudflare" ${sender.provider === "cloudflare" ? "selected" : ""}>
                    Cloudflare
                </option>
                <option value="resend" ${sender.provider === "resend" ? "selected" : ""}>
                    Resend
                </option>
            </select>

            <button
                type="button"
                onclick="deleteSender(${index})"
                style="width:auto;padding:8px 12px;"
            >
                DELETE
            </button>
        `;

        const status = document.createElement("div");

        status.style.cssText =
            "margin-top:7px;font-size:13px;font-weight:600;" +
            (sender.status === "dead"
                ? "color:#d93025;"
                : "color:#16803c;");

        status.textContent =
            sender.status === "dead"
                ? "🔴 DEAD"
                : "● ACTIVE";

        row.appendChild(fields);
        row.appendChild(status);
        container.appendChild(row);
    });

    saveSenders();
}

function escapeHtml(value) {
    return String(value || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}

function addSender() {
    senderPool.push({
        id: crypto.randomUUID(),
        name: "",
        email: "",
        provider: "cloudflare",
        status: "active"
    });

    saveSenders();
    renderSenders();
}

function updateSender(index, field, value) {
    if (!senderPool[index]) return;

    senderPool[index][field] = value.trim();

    if (field === "name" || field === "email" || field === "provider") {
        senderPool[index].status = "active";
    }

    saveSenders();
    renderSenders();
}

function deleteSender(index) {
    senderPool.splice(index, 1);
    saveSenders();
    renderSenders();
}

function getSenders() {
    return senderPool.filter(sender =>
        sender.status !== "dead" &&
        sender.email &&
        sender.email.includes("@")
    );
}

function getNextSender() {
    const active = getSenders();

    if (!active.length) {
        throw new Error("No active senders available.");
    }

    const index =
        mailQueue.senderIndex % active.length;

    const sender = active[index];

    mailQueue.senderIndex++;

    return {
        id: sender.id,
        name: sender.name,
        email: sender.email,
        provider: sender.provider
    };
}

function markSenderDead(senderId) {
    const sender = senderPool.find(
        item => item.id === senderId
    );

    if (!sender) return;

    sender.status = "dead";

    saveSenders();
    renderSenders();
}

renderSenders();

async function startSending() {
    if (mailQueue && !queueStopped) {
        if (queuePaused) {
            queuePaused = false;
            await processQueue();
        }
        return;
    }

    const sendBtn = document.getElementById("sendBtn");

    const senders = getSenders();
const rawTo = document
        .getElementById("sendTo")
        .value;

    const recipients = [
        ...new Set(
            rawTo
                .split(/\r?\n/)
                .map(email => email.trim())
                .filter(Boolean)
                .map(email => email.toLowerCase())
        )
    ];

    const variants = getVariants();

    if (senders.length === 0) {
        alert("Please add at least one active sender.");
        return;
    }

    if (recipients.length === 0) {
        alert("Please enter at least one recipient.");
        return;
    }

    if (variants.length === 0) {
        alert("Please complete at least one email variant.");
        return;
    }

    for (const variant of variants) {
        if (!variant.subject || !variant.body.trim()) {
            alert(
                "Every used variant must have both a subject and email body."
            );
            return;
        }
    }

    ensureQueueControls();

    const stats = document.getElementById("statsSection");
    const resultsList = document.getElementById("resultsList");

    stats.style.display = "block";
    resultsList.innerHTML = "";

    mailQueue = {
        senders,
        senderIndex: 0,
        variants,
        recipients,
        index: 0,
        sent: 0,
        failed: 0,
        results: []
    };

    queueRunning = false;
    queuePaused = false;
    queueStopped = false;

    document.getElementById("sentCount").textContent = "0";
    document.getElementById("notSentCount").textContent = "0";

    sendBtn.disabled = true;
    sendBtn.textContent = "QUEUE RUNNING...";

    updateQueueControls();
    updateQueueStatus(
        `Ready — ${recipients.length} unique recipients queued`
    );

    await processQueue();

    if (!mailQueue || mailQueue.index >= mailQueue.recipients.length || queueStopped) {
        sendBtn.disabled = false;
        sendBtn.textContent = "SEND EMAILS";
    }
}

ensureQueueControls();

</script>

</body>
</html>
