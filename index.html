<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Creative Workgroup — Mail Console</title>

<style>
:root {
    --bg: #0f172a;
    --card: #1e293b;
    --border: #334155;
    --text: #f8fafc;
    --muted: #94a3b8;
    --accent: #3b82f6;
    --accent-hover: #2563eb;
    --success: #22c55e;
    --danger: #ef4444;
}

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 20px;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
}

.container {
    width: 100%;
    max-width: 850px;
    margin: 0 auto;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 30px;
    box-shadow: 0 10px 25px rgba(0,0,0,.3);
}

h2 {
    margin-top: 0;
    font-size: 1.3rem;
    letter-spacing: .04em;
    border-bottom: 1px solid var(--border);
    padding-bottom: 15px;
    color: #38bdf8;
}

.access-gate {
    width: min(430px, 100%);
    margin: 12vh auto 0;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 30px;
    box-shadow: 0 10px 25px rgba(0,0,0,.3);
}

.access-gate h1 {
    margin: 0 0 10px;
    font-size: 1.45rem;
}

.access-gate p {
    margin: 0 0 22px;
    color: var(--muted);
}

.access-gate .gate-error {
    color: var(--danger);
    font-size: .88rem;
    margin-top: 10px;
    min-height: 20px;
}

.mail-header {
    display:flex;
    align-items:center;
    gap:10px;
    border-bottom:1px solid var(--border);
    padding-bottom:15px;
    margin-bottom:22px;
}

.mail-header h2 {
    flex:1;
    margin:0;
    border:0;
    padding:0;
}

.proxy-header-actions {
    display:flex;
    align-items:center;
    gap:12px;
    white-space:nowrap;
    font-size:.82rem;
    font-weight:700;
}

.proxy-count {
    cursor:pointer;
    color:var(--text);
}

.proxy-dead-count {
    cursor:pointer;
    color:var(--danger);
}

.proxy-add-btn {
    width:auto !important;
    margin:0 !important;
    padding:0 !important;
    background:transparent !important;
    color:var(--text) !important;
    font-size:1.5rem !important;
    line-height:1 !important;
}

.proxy-add-btn:hover {
    background:transparent !important;
    color:#38bdf8 !important;
}

.proxy-panel {
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.58);
    align-items:center;
    justify-content:center;
    z-index:10000;
    padding:20px;
}

.proxy-panel.open {
    display:flex;
}

.proxy-dialog {
    width:min(720px,100%);
    max-height:85vh;
    overflow:auto;
    background:var(--card);
    border:1px solid var(--border);
    border-radius:14px;
    padding:24px;
}

.proxy-dialog h3 {
    margin:0;
}

.proxy-card {
    border:1px solid var(--border);
    border-radius:10px;
    padding:14px;
    margin-top:10px;
}

.proxy-card.dead {
    border-color:rgba(239,68,68,.55);
}

.proxy-card-top {
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
}

.proxy-address {
    font-weight:700;
}

.proxy-status-live {
    color:var(--success);
    font-size:.78rem;
    font-weight:700;
}

.proxy-status-dead {
    color:var(--danger);
    font-size:.78rem;
    font-weight:700;
}

.proxy-meta {
    color:var(--muted);
    font-size:.82rem;
    margin-top:6px;
}

.proxy-error {
    color:var(--danger);
    font-size:.78rem;
    margin-top:6px;
    word-break:break-word;
}

.proxy-actions {
    display:flex;
    justify-content:flex-end;
    gap:8px;
    margin-top:12px;
}

.proxy-actions button {
    width:auto;
    margin:0;
    padding:8px 12px;
    font-size:.82rem;
}

.proxy-secondary {
    background:var(--border);
}

.proxy-danger {
    background:var(--danger);
}

.proxy-form-grid {
    display:grid;
    grid-template-columns:2fr 1fr;
    gap:12px;
}

.proxy-form-full {
    grid-column:1 / -1;
}

@media (max-width:600px) {
    .container {
        padding:20px;
    }
    .proxy-header-actions {
        gap:7px;
        font-size:.75rem;
    }
    .mail-header {
        align-items:flex-start;
    }
    .proxy-form-grid {
        grid-template-columns:1fr;
    }
}

.form-group {
    margin-bottom: 20px;
}

label {
    display: block;
    margin-bottom: 8px;
    font-size: .82rem;
    font-weight: 600;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: .05em;
}

input,
textarea {
    width: 100%;
    padding: 11px 12px;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 7px;
    color: var(--text);
    font-size: .95rem;
}

textarea {
    resize: vertical;
    min-height: 110px;
    font-family: inherit;
}

input:focus,
textarea:focus {
    outline: none;
    border-color: var(--accent);
}

.section-title {
    margin: 28px 0 15px;
    font-size: .95rem;
    font-weight: 700;
    color: #38bdf8;
    text-transform: uppercase;
    letter-spacing: .06em;
}

.variant {
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 18px;
    margin-bottom: 15px;
    background: rgba(15, 23, 42, .55);
}

.variant-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 14px;
}

.variant-number {
    font-weight: 700;
    color: var(--text);
}

.variant-badge {
    font-size: .72rem;
    color: var(--muted);
}

button {
    width: 100%;
    padding: 13px;
    background: var(--accent);
    color: white;
    border: none;
    border-radius: 7px;
    cursor: pointer;
    font-size: 1rem;
    font-weight: bold;
    margin-top: 8px;
}

button:hover {
    background: var(--accent-hover);
}

button:disabled {
    background: var(--border);
    cursor: not-allowed;
}

.stats-box {
    margin-top: 25px;
    border-top: 1px solid var(--border);
    padding-top: 20px;
}

.stats-row {
    display: flex;
    justify-content: space-between;
    gap: 15px;
    margin-bottom: 10px;
    font-size: .95rem;
}

.results-list {
    margin-top: 15px;
    max-height: 350px;
    overflow-y: auto;
    border: 1px solid var(--border);
    border-radius: 7px;
    background: var(--bg);
    padding: 10px;
}

.result-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    padding: 9px 8px;
    border-bottom: 1px solid var(--card);
    font-size: .84rem;
}

.result-item:last-child {
    border-bottom: none;
}

.result-email {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}

.tag-sent {
    color: var(--success);
    font-weight: bold;
    white-space: nowrap;
}

.tag-failed {
    color: var(--danger);
    font-weight: bold;
    white-space: nowrap;
}

.variant-result {
    color: var(--muted);
    white-space: nowrap;
}

.sender-row {
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    padding:12px 14px;
    margin-bottom:8px;
    border:1px solid var(--border,#ddd);
    border-radius:10px;
}

.sender-identity {
    min-width:0;
}

.sender-name {
    font-weight:600;
    overflow:hidden;
    text-overflow:ellipsis;
}

.sender-status {
    font-size:12px;
    margin-top:4px;
    font-weight:600;
}

.sender-active {
    color:#16803c;
}

.sender-dead {
    color:#d93025;
}

.sender-delete {
    width:auto !important;
    border:0;
    background:transparent;
    cursor:pointer;
    font-size:18px;
    padding:6px 8px !important;
}

</style>
</head>

<body>

<div class="access-gate" id="accessGate">
    <h1>Access restricted</h1>
    <p>Enter your access code to continue.</p>
    <label for="accessCodeInput">Access code</label>
    <input
        id="accessCodeInput"
        type="password"
        autocomplete="off"
        placeholder="Access code"
        onkeydown="if(event.key === 'Enter') unlockMailConsole()"
    >
    <button type="button" id="unlockBtn" onclick="unlockMailConsole()">Unlock</button>
    <div class="gate-error" id="gateError"></div>
</div>

<div class="container" id="mailConsole" style="display:none;">

    <div class="mail-header">
        <h2>Creative Workgroup Mail</h2>
        <div class="proxy-header-actions">
            <span class="proxy-count" id="proxyCount" onclick="openProxyManager('active')">0 Proxies</span>
            <span class="proxy-dead-count" id="proxyDeadCount" style="display:none;" onclick="openProxyManager('dead')">0 dead</span>
            <button type="button" class="proxy-add-btn" title="Add proxy" aria-label="Add proxy" onclick="openProxyModal()">＋</button>
        </div>
    </div>

    <div class="form-group">
        <label>Send From</label>

        <div id="senderPool"></div>

        <button
            type="button"
            id="addSenderBtn"
            style="width:auto;padding:10px 16px;margin-top:10px;"
            onclick="openSenderModal()"
        >
            ＋ ADD SENDER
        </button>
    </div>

    <div class="proxy-panel" id="proxyManagerModal" onclick="if(event.target===this) closeProxyManager()">
        <div class="proxy-dialog">
            <div style="display:flex;justify-content:space-between;align-items:center;gap:12px;">
                <h3 id="proxyManagerTitle">Live Proxies</h3>
                <button type="button" class="proxy-add-btn" onclick="closeProxyManager()">×</button>
            </div>
            <div id="proxyList"></div>
        </div>
    </div>

    <div class="proxy-panel" id="proxyEditModal" onclick="if(event.target===this) closeProxyModal()">
        <div class="proxy-dialog" style="max-width:520px;">
            <h3 id="proxyEditTitle">Add Proxy</h3>
            <div class="proxy-form-grid" style="margin-top:18px;">
                <div>
                    <label>Proxy Address</label>
                    <input id="proxyAddressInput" type="text" placeholder="31.59.20.176">
                </div>
                <div>
                    <label>Port</label>
                    <input id="proxyPortInput" type="number" min="1" max="65535" placeholder="6754">
                </div>
                <div class="proxy-form-full">
                    <label>Username</label>
                    <input id="proxyUsernameInput" type="text" autocomplete="off" placeholder="Proxy username">
                </div>
                <div class="proxy-form-full">
                    <label>Password</label>
                    <input id="proxyPasswordInput" type="password" autocomplete="new-password" placeholder="Proxy password">
                </div>
            </div>
            <div id="proxyEditHint" class="proxy-meta"></div>
            <div class="proxy-actions">
                <button type="button" class="proxy-secondary" onclick="closeProxyModal()">CANCEL</button>
                <button type="button" id="saveProxyBtn" onclick="saveProxy()">SAVE PROXY</button>
            </div>
        </div>
    </div>

    <div
        id="senderModal"
        style="
            display:none;
            position:fixed;
            inset:0;
            background:rgba(0,0,0,.55);
            align-items:center;
            justify-content:center;
            z-index:9999;
            padding:20px;
        "
    >
        <div
            style="
                width:min(520px,100%);
                background:var(--card,#fff);
                border-radius:14px;
                padding:24px;
                box-sizing:border-box;
            "
        >
            <h3 style="margin-top:0;">
                Add Sender
            </h3>

            <label>Sender Name</label>
            <input
                id="senderNameInput"
                type="text"
                placeholder="Ashley Owen"
            >

            <label>Sender Email</label>
            <input
                id="senderEmailInput"
                type="email"
                placeholder="ashleyowen@example.com"
            >

            <label>Provider</label>
            <select
                id="senderProviderInput"
                onchange="updateCredentialFields()"
            >
                <option value="cloudflare">
                    Cloudflare
                </option>
                <option value="resend">
                    Resend
                </option>
            </select>

            <label id="senderCredentialLabel">
                Cloudflare API Token
            </label>

            <input
                id="senderCredentialInput"
                type="password"
                autocomplete="new-password"
                placeholder="Enter credential"
            >

            <div id="senderAccountGroup">
                <label>
                    Cloudflare Account ID
                </label>

                <input
                    id="senderAccountInput"
                    type="password"
                    autocomplete="new-password"
                    placeholder="Enter Account ID"
                >
            </div>

            <div
                style="
                    display:flex;
                    justify-content:flex-end;
                    gap:10px;
                    margin-top:20px;
                "
            >
                <button
                    type="button"
                    onclick="closeSenderModal()"
                >
                    CANCEL
                </button>

                <button
                    type="button"
                    id="saveSenderBtn"
                    onclick="saveSender()"
                >
                    SAVE SENDER
                </button>
            </div>
        </div>
    </div>

    <div class="form-group">
</div>

    <div class="section-title">Email Variants</div>

    <div id="variants"></div>

    <div style="display:flex;justify-content:flex-end;margin:14px 0 10px;">
        <button
            type="button"
            id="addVariantBtn"
            style="width:auto;padding:10px 16px;"
            onclick="addVariant()"
        >
            ＋ ADD SUBJECT & EMAIL
        </button>
    </div>

    <div class="section-title">Recipients</div>

    <div class="form-group">
        <label>Send To — One Recipient Per Line</label>
        <textarea
            id="sendTo"
            placeholder="customer1@gmail.com
customer2@gmail.com
customer3@gmail.com"></textarea>
    </div>

    <button id="sendBtn" type="button" onclick="startSending()">
        SEND EMAILS
    </button>

    <div class="stats-box" id="statsSection" style="display:none;">

        <div class="stats-row" id="sendingProgress">
            <strong>Status:</strong>
            <span>Ready</span>
        </div>

        <div class="stats-row">
            <span>
                Sent:
                <strong id="sentCount" style="color:var(--success)">0</strong>
            </span>

            <span>
                Not Sent:
                <strong id="notSentCount" style="color:var(--danger)">0</strong>
            </span>
        </div>

        <div class="results-list" id="resultsList"></div>

    </div>

</div>

<script>
const variantContainer = document.getElementById("variants");

let proxyPool = [];
let editingProxyId = null;
let proxyManagerMode = "active";

function showMailConsole() {
    document.getElementById("accessGate").style.display = "none";
    document.getElementById("mailConsole").style.display = "block";
    loadSenders();
    loadProxies();
}

async function unlockMailConsole() {
    const input = document.getElementById("accessCodeInput");
    const button = document.getElementById("unlockBtn");
    const errorEl = document.getElementById("gateError");
    const accessCode = input.value.trim();

    errorEl.textContent = "";

    if (!accessCode) {
        errorEl.textContent = "Enter your access code.";
        return;
    }

    button.disabled = true;
    button.textContent = "Unlocking...";

    try {
        const response = await fetch("/api/auth/unlock", {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify({access_code: accessCode})
        });
        const data = await response.json();

        if (!response.ok || !data.success) {
            throw new Error(data.error || "Access denied.");
        }

        input.value = "";
        showMailConsole();
    } catch (error) {
        errorEl.textContent = error.message || "Access denied.";
    } finally {
        button.disabled = false;
        button.textContent = "Unlock";
    }
}

async function loadProxies() {
    try {
        const response = await fetch("/api/proxies", {
            headers: {"Accept": "application/json"},
            cache: "no-store"
        });

        if (response.status === 401) return;

        const data = await response.json();
        if (!response.ok || !data.success) {
            throw new Error(data.error || "Unable to load proxies.");
        }

        proxyPool = Array.isArray(data.proxies) ? data.proxies : [];
        renderProxyCounts();
    } catch (error) {
        console.error("Unable to load proxy pool:", error);
    }
}

function renderProxyCounts() {
    const live = proxyPool.filter(proxy => proxy.status === "active").length;
    const dead = proxyPool.filter(proxy => proxy.status === "dead").length;

    document.getElementById("proxyCount").textContent =
        `${live} ${live === 1 ? "Proxy" : "Proxies"}`;

    const deadEl = document.getElementById("proxyDeadCount");
    deadEl.textContent = `${dead} dead`;
    deadEl.style.display = dead ? "inline" : "none";
}

function openProxyManager(mode = "active") {
    proxyManagerMode = mode;
    renderProxyManager();
    document.getElementById("proxyManagerModal").classList.add("open");
}

function closeProxyManager() {
    document.getElementById("proxyManagerModal").classList.remove("open");
}

function renderProxyManager() {
    const list = document.getElementById("proxyList");
    const title = document.getElementById("proxyManagerTitle");
    const proxies = proxyPool.filter(proxy =>
        proxyManagerMode === "dead"
            ? proxy.status === "dead"
            : proxy.status === "active"
    );

    title.textContent = proxyManagerMode === "dead"
        ? `Dead Proxies (${proxies.length})`
        : `Live Proxies (${proxies.length})`;

    if (!proxies.length) {
        list.innerHTML = `<div class="proxy-meta" style="padding:20px 0;">No ${proxyManagerMode === "dead" ? "dead" : "live"} proxies.</div>`;
        return;
    }

    list.innerHTML = proxies.map(proxy => {
        const statusClass = proxy.status === "dead"
            ? "proxy-status-dead"
            : "proxy-status-live";

        const error = proxy.last_error
            ? `<div class="proxy-error">${escapeHtml(proxy.last_error)}</div>`
            : "";

        const checked = proxy.last_checked_at
            ? `Last checked: ${escapeHtml(new Date(proxy.last_checked_at).toLocaleString())}`
            : "Not tested yet";

        return `
            <div class="proxy-card ${proxy.status === "dead" ? "dead" : ""}">
                <div class="proxy-card-top">
                    <span class="proxy-address">
                        ${escapeHtml(proxy.address)}:${escapeHtml(proxy.port)}
                    </span>
                    <span class="${statusClass}">
                        ● ${proxy.status === "dead" ? "DEAD" : "LIVE"}
                    </span>
                </div>
                <div class="proxy-meta">
                    Username: ${escapeHtml(proxy.username || "—")}
                </div>
                <div class="proxy-meta">${checked}</div>
                ${error}
                <div class="proxy-actions">
                    ${proxy.status === "dead"
                        ? `<button type="button" class="proxy-secondary" onclick="testProxy('${proxy.id}')">TEST AGAIN</button>`
                        : ""}
                    <button type="button" class="proxy-secondary" onclick="openProxyModal('${proxy.id}')">EDIT</button>
                    <button type="button" class="proxy-danger" onclick="deleteProxy('${proxy.id}')">DELETE</button>
                </div>
            </div>
        `;
    }).join("");
}

function openProxyModal(proxyId = null) {
    editingProxyId = proxyId;
    const proxy = proxyId ? proxyPool.find(item => item.id === proxyId) : null;

    document.getElementById("proxyEditTitle").textContent =
        proxy ? "Edit Proxy" : "Add Proxy";
    document.getElementById("proxyAddressInput").value = proxy?.address || "";
    document.getElementById("proxyPortInput").value = proxy?.port || "";
    document.getElementById("proxyUsernameInput").value = proxy?.username || "";
    document.getElementById("proxyPasswordInput").value = "";
    document.getElementById("proxyEditHint").textContent =
        proxy
            ? "Leave password blank to keep the existing password."
            : "Proxy credentials are stored securely on the server.";

    document.getElementById("proxyEditModal").classList.add("open");
}

function closeProxyModal() {
    document.getElementById("proxyEditModal").classList.remove("open");
    editingProxyId = null;
}

async function saveProxy() {
    const address = document.getElementById("proxyAddressInput").value.trim();
    const port = document.getElementById("proxyPortInput").value.trim();
    const username = document.getElementById("proxyUsernameInput").value.trim();
    const password = document.getElementById("proxyPasswordInput").value;

    if (!address || !port) {
        alert("Proxy address and port are required.");
        return;
    }

    if (!editingProxyId && !password) {
        alert("Proxy password is required.");
        return;
    }

    const button = document.getElementById("saveProxyBtn");
    button.disabled = true;
    button.textContent = "SAVING...";

    try {
        const url = editingProxyId
            ? `/api/proxies/${encodeURIComponent(editingProxyId)}`
            : "/api/proxies";

        const response = await fetch(url, {
            method: editingProxyId ? "PATCH" : "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify({address, port, username, password})
        });

        const data = await response.json();
        if (!response.ok || !data.success) {
            throw new Error(data.error || "Unable to save proxy.");
        }

        closeProxyModal();
        await loadProxies();

        if (document.getElementById("proxyManagerModal").classList.contains("open")) {
            renderProxyManager();
        }
    } catch (error) {
        alert(error.message || "Unable to save proxy.");
    } finally {
        button.disabled = false;
        button.textContent = "SAVE PROXY";
    }
}

async function deleteProxy(proxyId) {
    const proxy = proxyPool.find(item => item.id === proxyId);
    if (!proxy) return;

    if (!confirm(`Delete ${proxy.address}:${proxy.port}?`)) return;

    try {
        const response = await fetch(
            `/api/proxies/${encodeURIComponent(proxyId)}`,
            {method: "DELETE"}
        );
        const data = await response.json();

        if (!response.ok || !data.success) {
            throw new Error(data.error || "Unable to delete proxy.");
        }

        proxyPool = proxyPool.filter(item => item.id !== proxyId);
        renderProxyCounts();
        renderProxyManager();
    } catch (error) {
        alert(error.message || "Unable to delete proxy.");
    }
}

async function testProxy(proxyId) {
    try {
        const response = await fetch(
            `/api/proxies/${encodeURIComponent(proxyId)}/test`,
            {method: "POST"}
        );
        const data = await response.json();

        if (!response.ok || !data.success) {
            throw new Error(data.error || "Proxy test failed.");
        }

        await loadProxies();
        renderProxyManager();
    } catch (error) {
        await loadProxies();
        renderProxyManager();
        alert(error.message || "Proxy test failed.");
    }
}

const defaultVariants = [
    {
        subject: `Connecting with top-tier event planners for an upcoming venture`,
        body: `Hi,

Trust this email finds you well. 

As we pull together plans for an upcoming venture, we are looking to connect with top-tier event planners who excel at turning ideas into reality. 

Could you send over details regarding your core services, the kinds of functions you generally oversee, and your pricing structures? It would also be helpful to understand your preferred method of client collaboration.

If it proves to be a strong mutual fit, we can move forward with sharing the full project brief.

Best,  
Ashley Mok`

function renumberVariants() {

        const title = card.querySelector("strong");

            title.textContent = `Variant ${index + 1}`;

}

function getVariants() {
    const variants = [];

    for (let i = 1; i <= 5; i++) {
        const subject = document
            .getElementById(`subject${i}`)
            .value
            .trim();

        const body = document
            .getElementById(`body${i}`)
            .value;

        if (subject || body.trim()) {
            variants.push({
                subject,
                body
            });

    }

    return variants;
}

        item.appendChild(email);
        item.appendChild(variant);
        item.appendChild(status);

        list.appendChild(item);

let mailQueue = null;
let queueRunning = false;
let queuePaused = false;
let queueStopped = false;
let queueCountdownTimer = null;

function ensureQueueControls() {
    if (document.getElementById("queueControls")) return;

    const sendBtn = document.getElementById("sendBtn");

    const controls = document.createElement("div");
    controls.id = "queueControls";
    controls.style.cssText = `
        display:flex;
        gap:10px;
        margin-top:12px;
        flex-wrap:wrap;
    `;

    controls.innerHTML = `
        <button type="button" id="playQueueBtn">▶ PLAY</button>
        <button type="button" id="pauseQueueBtn">⏸ PAUSE</button>
        <button type="button" id="stopQueueBtn">■ STOP</button>
    `;

    sendBtn.parentNode.insertBefore(controls, sendBtn.nextSibling);

    document.getElementById("playQueueBtn").addEventListener("click", async () => {
        if (!mailQueue) {
            startSending();
            return;
        }

        if (queueRunning || !queuePaused || queueStopped) return;

        queuePaused = false;
        queueStopped = false;
        updateQueueControls();
        await processQueue();
    });

    document.getElementById("pauseQueueBtn").addEventListener("click", () => {
        if (!mailQueue || !queueRunning) return;

        queuePaused = true;
        queueRunning = false;
        clearInterval(queueCountdownTimer);

        updateQueueStatus("Paused — press PLAY to continue");
        updateQueueControls();
    });

    document.getElementById("stopQueueBtn").addEventListener("click", () => {
        if (!mailQueue) return;

        queueStopped = true;
        queuePaused = false;
        queueRunning = false;
        clearInterval(queueCountdownTimer);

        updateQueueStatus(
            `Stopped — ${mailQueue.index} / ${mailQueue.recipients.length} processed`
        );

        updateQueueControls();
    });

    updateQueueControls();
}

function updateQueueControls() {
    const play = document.getElementById("playQueueBtn");
    const pause = document.getElementById("pauseQueueBtn");
    const stop = document.getElementById("stopQueueBtn");

    if (!play || !pause || !stop) return;

    if (!mailQueue) {
        play.disabled = false;
        pause.disabled = true;
        stop.disabled = true;
        return;
    }

    play.disabled = queueRunning || queueStopped;
    pause.disabled = !queueRunning;
    stop.disabled = queueStopped || mailQueue.index >= mailQueue.recipients.length;
}

function updateQueueStatus(message) {
    const progress = document.getElementById("sendingProgress");

    if (!mailQueue) return;

    const total = mailQueue.recipients.length;
    const processed = mailQueue.index;
    const remaining = Math.max(total - processed, 0);

    progress.innerHTML = `
        <strong>Status:</strong>
        <span>
            SENT ${mailQueue.sent} / ${total}
            &nbsp;•&nbsp;
            FAILED ${mailQueue.failed}
            &nbsp;•&nbsp;
            REMAINING ${remaining}
        </span>
        <br>
        <span>${message}</span>
    `;
}

function addQueueResult(result) {
    mailQueue.results.push(result);

    const resultsList = document.getElementById("resultsList");
    resultsList.innerHTML = "";

    mailQueue.results.forEach(result => {
        const item = document.createElement("div");
        item.className = "result-item";

        const email = document.createElement("span");
        email.className = "result-email";
        email.textContent = result.email;

        const variant = document.createElement("span");
        variant.className = "variant-result";
        variant.textContent =
            result.variant === "—"
                ? "—"
                : `V${result.variant}`;

        const status = document.createElement("span");
        status.className =
            result.status === "Sent"
                ? "tag-sent"
                : "tag-failed";
        status.textContent = result.status;

        item.appendChild(email);
        item.appendChild(variant);
        item.appendChild(status);

        if (result.status !== "Sent" && result.error) {
            const error = document.createElement("span");
            error.className = "result-error";
            error.textContent =
                typeof result.error === "string"
                    ? result.error
                    : JSON.stringify(result.error);
            item.appendChild(error);
        }

        resultsList.appendChild(item);
    });
}

async function waitTenSeconds() {
    for (let seconds = 10; seconds > 0; seconds--) {
        if (!mailQueue || queueStopped) return false;

        while (queuePaused && !queueStopped) {
            updateQueueStatus("Paused — press PLAY to continue");
            await new Promise(resolve => setTimeout(resolve, 250));
        }

        if (queueStopped) return false;

        updateQueueStatus(`Next email in ${seconds} seconds...`);

        await new Promise(resolve => setTimeout(resolve, 1000));
    }

    return !queueStopped;
}

async function processQueue() {
    if (!mailQueue || queueRunning || queueStopped) return;

    queueRunning = true;
    queuePaused = false;
    updateQueueControls();

    const {
        variants,
        recipients
    } = mailQueue;

    try {
        while (
            mailQueue.index < recipients.length &&
            !queueStopped
        ) {
            while (queuePaused && !queueStopped) {
                queueRunning = false;
                updateQueueStatus("Paused — press PLAY to continue");
                updateQueueControls();

                await new Promise(resolve => setTimeout(resolve, 250));

                if (!queuePaused && !queueStopped) {
                    queueRunning = true;
                    updateQueueControls();
                }
            }

            if (queueStopped) break;

            const recipient = recipients[mailQueue.index];

            updateQueueStatus(
                `Sending ${mailQueue.index + 1} / ${recipients.length} — ${recipient}`
            );

            try {
                const response = await fetch("/api/send", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        sender: getNextSender(),
                        to: [recipient],
                        variants
                    })
                });

                const data = await response.json();

                if (data.sender_failed && data.sender_id) {
                    markSenderDead(data.sender_id);

                    const deadSender = senderPool.find(
                        sender => sender.id === data.sender_id
                    );

                    updateQueueStatus(
                        `Sender ${deadSender?.email || "unknown"} marked DEAD — continuing`
                    );

                    mailQueue.failed++;

                    addQueueResult({
                        email: recipient,
                        status: "Failed",
                        variant:
                            data.results &&
                            data.results.length &&
                            data.results[0].variant
                                ? data.results[0].variant
                                : "—",
                        error:
                            data.error ||
                            (
                                data.results &&
                                data.results.length
                                    ? data.results[0].error
                                    : "Sender failed"
                            ),
                        sender: data.sender,
                        provider: data.provider,
                        sender_failed: true
                    });

                    mailQueue.index++;
                    continue;
                }

                const result =
                    data.results && data.results.length
                        ? data.results[0]
                        : null;

                if (!response.ok || !result) {
                    throw new Error(
                        typeof data.error === "string"
                            ? data.error
                            : JSON.stringify(data.error || data)
                    );
                }

                addQueueResult(result);

                if (result.status === "Sent") {
                    mailQueue.sent++;
                } else {
                    mailQueue.failed++;
                }

            } catch (error) {
                mailQueue.failed++;

                addQueueResult({
                    email: recipient,
                    status: "Failed",
                    variant: "—",
                    error: error.message || String(error)
                });
            }

            mailQueue.index++;

            document.getElementById("sentCount").textContent =
                mailQueue.sent;

            document.getElementById("notSentCount").textContent =
                mailQueue.failed;

            updateQueueStatus(
                `Completed ${mailQueue.index} / ${recipients.length}`
            );

            if (
                mailQueue.index < recipients.length &&
                !queueStopped
            ) {
                const completed = await waitTenSeconds();

                if (!completed) break;
            }
        }

        if (queueStopped) {
            updateQueueStatus(
                `Stopped — ${mailQueue.index} / ${recipients.length} processed`
            );
            return;
        }

        if (mailQueue.index >= recipients.length) {
            updateQueueStatus(
                `Completed — ${recipients.length} processed`
            );

            document.getElementById("sendTo").value = "";

            queueRunning = false;
            queuePaused = false;

            updateQueueControls();
        }

    } finally {
        queueRunning = false;
        updateQueueControls();
    }
}



let senderPool = [];

// Sender records are persisted server-side in Supabase.
// Browser storage is intentionally not used, so every browser/profile/device
// sees the same sender pool.
async function loadSenders() {
    try {
        const response = await fetch("/api/senders", {
            method: "GET",
            headers: { "Accept": "application/json" },
            cache: "no-store"
        });

        const data = await response.json();

        if (!response.ok || !data.success) {
            throw new Error(data.error || "Unable to load senders.");
        }

        senderPool = Array.isArray(data.senders) ? data.senders : [];
        renderSenders();
    } catch (error) {
        senderPool = [];
        renderSenders();
        console.error("Unable to load sender pool:", error);
        alert(error.message || "Unable to load saved senders.");
    }
}

// Kept as a compatibility no-op for existing sender actions.
// Persistence is handled by the server API, not browser storage.
function saveSenders() {}

function escapeHtml(value) {
    return String(value || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}

function renderSenders() {
    const container = document.getElementById("senderPool");
    if (!container) return;

    container.innerHTML = "";

    senderPool.forEach((sender, index) => {
        const row = document.createElement("div");

        row.className = "sender-row";

        row.innerHTML = `
            <div class="sender-identity">
                <div class="sender-name">
                    ${escapeHtml(
                        sender.name
                        ? `${sender.name} <${sender.email}>`
                        : sender.email
                    )}
                </div>

                <div class="sender-status ${
                    sender.status === "dead"
                        ? "sender-dead"
                        : "sender-active"
                }">
                    ${
                        sender.status === "dead"
                            ? "● DEAD"
                            : "● ACTIVE"
                    }
                </div>
            </div>

            <button
                type="button"
                class="sender-delete"
                title="Delete sender"
                aria-label="Delete sender"
                onclick="deleteSender(${index})"
            >
                🗑
            </button>
        `;

        container.appendChild(row);
    });

    saveSenders();
}

function openSenderModal() {
    const modal = document.getElementById("senderModal");
    if (!modal) return;

    document.getElementById("senderNameInput").value = "";
    document.getElementById("senderEmailInput").value = "";
    document.getElementById("senderCredentialInput").value = "";
    document.getElementById("senderAccountInput").value = "";

    updateCredentialFields();

    modal.style.display = "flex";
}

function closeSenderModal() {
    const modal = document.getElementById("senderModal");
    if (modal) {
        modal.style.display = "none";
    }
}

function updateCredentialFields() {
    const provider =
        document.getElementById("senderProviderInput").value;

    const credentialLabel =
        document.getElementById("senderCredentialLabel");

    const accountGroup =
        document.getElementById("senderAccountGroup");

    if (provider === "cloudflare") {
        credentialLabel.textContent =
            "Cloudflare API Token";

        accountGroup.style.display = "block";
    } else {
        credentialLabel.textContent =
            "Resend API Key";

        accountGroup.style.display = "none";
    }
}

async function saveSender() {
    const name =
        document.getElementById("senderNameInput")
            .value
            .trim();

    const email =
        document.getElementById("senderEmailInput")
            .value
            .trim();

    const provider =
        document.getElementById("senderProviderInput")
            .value;

    const credential =
        document.getElementById("senderCredentialInput")
            .value
            .trim();

    const accountId =
        document.getElementById("senderAccountInput")
            .value
            .trim();

    if (!email) {
        alert("Sender email is required.");
        return;
    }

    if (!credential) {
        alert("Credential is required.");
        return;
    }

    if (
        provider === "cloudflare" &&
        !accountId
    ) {
        alert("Cloudflare Account ID is required.");
        return;
    }

    const saveButton =
        document.getElementById("saveSenderBtn");

    saveButton.disabled = true;
    saveButton.textContent = "SAVING...";

    try {
        const response = await fetch("/api/senders", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                id: crypto.randomUUID(),
                name,
                email,
                provider,
                credential,
                account_id: accountId
            })
        });

        const data = await response.json();

        if (!response.ok || !data.success) {
            throw new Error(
                data.error || "Unable to save sender."
            );
        }

        senderPool.push({
            id: data.sender.id,
            name: data.sender.name,
            email: data.sender.email,
            provider: data.sender.provider,
            status: "active"
        });

        saveSenders();
        renderSenders();
        closeSenderModal();

    } catch (error) {
        alert(
            error.message ||
            "Unable to save sender."
        );
    } finally {
        saveButton.disabled = false;
        saveButton.textContent = "SAVE SENDER";
    }
}

async function deleteSender(index) {
    const sender = senderPool[index];

    if (!sender) return;

    if (
        !confirm(
            `Delete ${sender.email}?`
        )
    ) {
        return;
    }

    try {
        const response = await fetch(
            `/api/senders/${encodeURIComponent(sender.id)}`,
            {
                method: "DELETE"
            }
        );

        const data = await response.json();

        if (!response.ok || !data.success) {
            throw new Error(
                data.error ||
                "Unable to delete sender."
            );
        }

        senderPool.splice(index, 1);

        saveSenders();
        renderSenders();

    } catch (error) {
        alert(
            error.message ||
            "Unable to delete sender."
        );
    }
}

function getSenders() {
    return senderPool.filter(sender =>
        sender.status !== "dead" &&
        sender.email &&
        sender.email.includes("@")
    );
}

function getNextSender() {
    const active = getSenders();

    if (!active.length) {
        throw new Error(
            "No active senders available."
        );
    }

    const index =
        mailQueue.senderIndex %
        active.length;

    const sender = active[index];

    mailQueue.senderIndex++;

    return {
        id: sender.id,
        name: sender.name,
        email: sender.email,
        provider: sender.provider
    };
}

function markSenderDead(senderId) {
    const sender = senderPool.find(
        item => item.id === senderId
    );

    if (!sender) return;

    sender.status = "dead";

    saveSenders();
    renderSenders();
}

async function startSending() {
    if (mailQueue && !queueStopped) {
        if (queuePaused) {
            queuePaused = false;
            await processQueue();
        }
        return;
    }

    const sendBtn = document.getElementById("sendBtn");

    const senders = getSenders();
const rawTo = document
        .getElementById("sendTo")
        .value;

    const recipients = [
        ...new Set(
            rawTo
                .split(/\r?\n/)
                .map(email => email.trim())
                .filter(Boolean)
                .map(email => email.toLowerCase())
        )
    ];

    const variants = getVariants();

    if (senders.length === 0) {
        alert("Please add at least one active sender.");
        return;
    }

    if (recipients.length === 0) {
        alert("Please enter at least one recipient.");
        return;
    }

    if (variants.length === 0) {
        alert("Please complete at least one email variant.");
        return;
    }

    for (const variant of variants) {
        if (!variant.subject || !variant.body.trim()) {
            alert(
                "Every used variant must have both a subject and email body."
            );
            return;
        }
    }

    ensureQueueControls();

    const stats = document.getElementById("statsSection");
    const resultsList = document.getElementById("resultsList");

    stats.style.display = "block";
    resultsList.innerHTML = "";

    mailQueue = {
        senders,
        senderIndex: 0,
        variants,
        recipients,
        index: 0,
        sent: 0,
        failed: 0,
        results: []
    };

    queueRunning = false;
    queuePaused = false;
    queueStopped = false;

    document.getElementById("sentCount").textContent = "0";
    document.getElementById("notSentCount").textContent = "0";

    sendBtn.disabled = true;
    sendBtn.textContent = "QUEUE RUNNING...";

    updateQueueControls();
    updateQueueStatus(
        `Ready — ${recipients.length} unique recipients queued`
    );

    await processQueue();

    if (!mailQueue || mailQueue.index >= mailQueue.recipients.length || queueStopped) {
        sendBtn.disabled = false;
        sendBtn.textContent = "SEND EMAILS";
    }
}

ensureQueueControls();
