<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Creative Workgroup — Mail Console</title>

<style>
:root {
    --bg: #0f172a;
    --card: #1e293b;
    --border: #334155;
    --text: #f8fafc;
    --muted: #94a3b8;
    --accent: #3b82f6;
    --accent-hover: #2563eb;
    --success: #22c55e;
    --danger: #ef4444;
}

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 20px;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
}

.container {
    width: 100%;
    max-width: 850px;
    margin: 0 auto;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 30px;
    box-shadow: 0 10px 25px rgba(0,0,0,.3);
}

h2 {
    margin-top: 0;
    font-size: 1.3rem;
    letter-spacing: .04em;
    border-bottom: 1px solid var(--border);
    padding-bottom: 15px;
    color: #38bdf8;
}

.form-group {
    margin-bottom: 20px;
}

label {
    display: block;
    margin-bottom: 8px;
    font-size: .82rem;
    font-weight: 600;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: .05em;
}

input,
textarea {
    width: 100%;
    padding: 11px 12px;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 7px;
    color: var(--text);
    font-size: .95rem;
}

textarea {
    resize: vertical;
    min-height: 110px;
    font-family: inherit;
}

input:focus,
textarea:focus {
    outline: none;
    border-color: var(--accent);
}

.section-title {
    margin: 28px 0 15px;
    font-size: .95rem;
    font-weight: 700;
    color: #38bdf8;
    text-transform: uppercase;
    letter-spacing: .06em;
}

.variant {
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 18px;
    margin-bottom: 15px;
    background: rgba(15, 23, 42, .55);
}

.variant-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 14px;
}

.variant-number {
    font-weight: 700;
    color: var(--text);
}

.variant-badge {
    font-size: .72rem;
    color: var(--muted);
}

button {
    width: 100%;
    padding: 13px;
    background: var(--accent);
    color: white;
    border: none;
    border-radius: 7px;
    cursor: pointer;
    font-size: 1rem;
    font-weight: bold;
    margin-top: 8px;
}

button:hover {
    background: var(--accent-hover);
}

button:disabled {
    background: var(--border);
    cursor: not-allowed;
}

.stats-box {
    margin-top: 25px;
    border-top: 1px solid var(--border);
    padding-top: 20px;
}

.stats-row {
    display: flex;
    justify-content: space-between;
    gap: 15px;
    margin-bottom: 10px;
    font-size: .95rem;
}

.results-list {
    margin-top: 15px;
    max-height: 350px;
    overflow-y: auto;
    border: 1px solid var(--border);
    border-radius: 7px;
    background: var(--bg);
    padding: 10px;
}

.result-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    padding: 9px 8px;
    border-bottom: 1px solid var(--card);
    font-size: .84rem;
}

.result-item:last-child {
    border-bottom: none;
}

.result-email {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}

.tag-sent {
    color: var(--success);
    font-weight: bold;
    white-space: nowrap;
}

.tag-failed {
    color: var(--danger);
    font-weight: bold;
    white-space: nowrap;
}

.variant-result {
    color: var(--muted);
    white-space: nowrap;
}
</style>
</head>

<body>

<div class="container">

    <h2>Creative Workgroup Mail</h2>

    <div class="form-group">
        <label>Send From</label>
        <input
            type="text"
            id="sendFrom"
            value="info@creativeworkgroup.org">
    </div>

    <div class="form-group">
        <label>Reply-To</label>
        <input
            type="text"
            id="replyTo"
            value="office@creativeworkgroup.org">
    </div>

    <div class="section-title">Email Variants</div>

    <div id="variants"></div>

    <div class="section-title">Recipients</div>

    <div class="form-group">
        <label>Send To — One Recipient Per Line</label>
        <textarea
            id="sendTo"
            placeholder="customer1@gmail.com
customer2@gmail.com
customer3@gmail.com"></textarea>
    </div>

    <button id="sendBtn" type="button" onclick="startSending()">
        SEND EMAILS
    </button>

    <div class="stats-box" id="statsSection" style="display:none;">

        <div class="stats-row" id="sendingProgress">
            <strong>Status:</strong>
            <span>Ready</span>
        </div>

        <div class="stats-row">
            <span>
                Sent:
                <strong id="sentCount" style="color:var(--success)">0</strong>
            </span>

            <span>
                Not Sent:
                <strong id="notSentCount" style="color:var(--danger)">0</strong>
            </span>
        </div>

        <div class="results-list" id="resultsList"></div>

    </div>

</div>

<script>
const variantContainer = document.getElementById("variants");

const defaultVariants = [
    {
        subject: "Event Planning & Management Inquiry – Creative Works Group",
        body: `Greetings,

I hope you’re doing well.

Creative Works Group is currently looking ahead to an upcoming event and we’re reaching out to experienced professionals to explore potential planning and event management support.

I’d be interested in learning more about the services you provide, the types of events you typically work on, and the packages or pricing options you currently offer. It would also be useful to understand how you usually approach and coordinate new event projects.

If there appears to be a good fit, we’d be happy to share the event details and discuss the requirements in more depth.

I look forward to hearing from you.
Best regards,
Ashley Mok`
    },
    {
        subject: "Exploring Event Management Partnership with Creative Works Group",
        body: `Greetings,

I hope you’re doing well.

Creative Works Group is currently looking ahead to an upcoming event and we’re reaching out to experienced professionals to explore potential planning and event management support.

I’d be interested in learning more about the services you provide, the types of events you typically work on, and the packages or pricing options you currently offer. It would also be useful to understand how you usually approach and coordinate new event projects.

If there appears to be a good fit, we’d be happy to share the event details and discuss the requirements in more depth.

I look forward to hearing from you.
Best regards,
Ashley Mok`
    },
    {
        subject: "Upcoming Event Support Services Inquiry",
        body: `Greetings,

I hope you’re doing well.

Creative Works Group is currently looking ahead to an upcoming event and we’re reaching out to experienced professionals to explore potential planning and event management support.

I’d be interested in learning more about the services you provide, the types of events you typically work on, and the packages or pricing options you currently offer. It would also be useful to understand how you usually approach and coordinate new event projects.

If there appears to be a good fit, we’d be happy to share the event details and discuss the requirements in more depth.

I look forward to hearing from you.
Best regards,
Ashley Mok`
    },
    {
        subject: "Collaboration Inquiry: Creative Works Group Event",
        body: `Greetings,

I hope you’re doing well.

Creative Works Group is currently looking ahead to an upcoming event and we’re reaching out to experienced professionals to explore potential planning and event management support.

I’d be interested in learning more about the services you provide, the types of events you typically work on, and the packages or pricing options you currently offer. It would also be useful to understand how you usually approach and coordinate new event projects.

If there appears to be a good fit, we’d be happy to share the event details and discuss the requirements in more depth.

I look forward to hearing from you.
Best regards,
Ashley Mok`
    },
    {
        subject: "Event Coordination Services - Creative Works Group",
        body: `Greetings,

I hope you’re doing well.

Creative Works Group is currently looking ahead to an upcoming event and we’re reaching out to experienced professionals to explore potential planning and event management support.

I’d be interested in learning more about the services you provide, the types of events you typically work on, and the packages or pricing options you currently offer. It would also be useful to understand how you usually approach and coordinate new event projects.

If there appears to be a good fit, we’d be happy to share the event details and discuss the requirements in more depth.

I look forward to hearing from you.
Best regards,
Ashley Mok`
    }
];

defaultVariants.forEach((item, index) => {
    const i = index + 1;
    const variant = document.createElement("div");

    variant.className = "variant";

    variant.innerHTML = `
        <div class="variant-header">
            <span class="variant-number">Variant ${i}</span>
            <span class="variant-badge">Subject + Email</span>
        </div>

        <div class="form-group">
            <label>Subject</label>
            <input
                type="text"
                id="subject${i}">
        </div>

        <div class="form-group" style="margin-bottom:0;">
            <label>Email Body</label>
            <textarea id="body${i}"></textarea>
        </div>
    `;

    variantContainer.appendChild(variant);

    document.getElementById(`subject${i}`).value = item.subject;
    document.getElementById(`body${i}`).value = item.body;
});

function getVariants() {
    const variants = [];

    for (let i = 1; i <= 5; i++) {
        const subject = document
            .getElementById(`subject${i}`)
            .value
            .trim();

        const body = document
            .getElementById(`body${i}`)
            .value;

        if (subject || body.trim()) {
            variants.push({
                subject,
                body
            });
        }
    }

    return variants;
}

function renderResults(results) {
    const list = document.getElementById("resultsList");

    list.innerHTML = "";

    results.forEach(result => {
        const item = document.createElement("div");

        item.className = "result-item";

        const email = document.createElement("span");
        email.className = "result-email";
        email.textContent = result.email;

        const variant = document.createElement("span");
        variant.className = "variant-result";
        variant.textContent = `V${result.variant}`;

        const status = document.createElement("span");
        status.className =
            result.status === "Sent"
                ? "tag-sent"
                : "tag-failed";

        status.textContent = result.status;

        item.appendChild(email);
        item.appendChild(variant);
        item.appendChild(status);

        list.appendChild(item);
    });
}

async function startSending() {
    const sendBtn = document.getElementById("sendBtn");
    const sendFrom = document
        .getElementById("sendFrom")
        .value
        .trim();
    const replyTo = document
        .getElementById("replyTo")
        .value
        .trim();
    const rawTo = document
        .getElementById("sendTo")
        .value;
    const recipients = rawTo
        .split(/\r?\n/)
        .map(email => email.trim())
        .filter(Boolean);

    const variants = getVariants();

    if (!sendFrom) {
        alert("Please enter a Send From email address.");
        return;
    }

    if (recipients.length === 0) {
        alert("Please enter at least one recipient.");
        return;
    }

    if (variants.length === 0) {
        alert("Please complete at least one email variant.");
        return;
    }

    for (const variant of variants) {
        if (!variant.subject || !variant.body.trim()) {
            alert("Every used variant must have both a subject and email body.");
            return;
        }
    }

    sendBtn.disabled = true;
    sendBtn.textContent = "SENDING...";

    const stats = document.getElementById("statsSection");
    const progress = document.getElementById("sendingProgress");
    const sentCount = document.getElementById("sentCount");
    const notSentCount = document.getElementById("notSentCount");
    const resultsList = document.getElementById("resultsList");

    stats.style.display = "block";
    sentCount.textContent = "0";
    notSentCount.textContent = "0";
    resultsList.innerHTML = "";

    let sent = 0;
    let failed = 0;

    try {
        for (let index = 0; index < recipients.length; index++) {
            const recipient = recipients[index];

            progress.innerHTML = `
                <strong>Status:</strong>
                <span>Sending ${index + 1} / ${recipients.length}</span>
            `;

            try {
                const response = await fetch("/api/send", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        from: sendFrom,
                        to: [recipient],
                        reply_to: replyTo,
                        variants
                    })
                });

                const data = await response.json();

                if (!response.ok || (!data.success && !data.results)) {
                    throw new Error(
                        typeof data.error === "string"
                            ? data.error
                            : JSON.stringify(data.error || data)
                    );
                }

                const result = data.results && data.results[0];

                if (result && result.status === "Sent") {
                    sent++;
                } else {
                    failed++;
                }

                sentCount.textContent = sent;
                notSentCount.textContent = failed;

                if (result) {
                    renderResults([result, ...Array.from(resultsList.children).map(() => null)].filter(Boolean));
                }

                // Rebuild the visible result list without losing previous results.
                if (result) {
                    const currentResults = Array.from(resultsList.children);
                    const item = document.createElement("div");
                    item.className = "result-item";

                    const email = document.createElement("span");
                    email.className = "result-email";
                    email.textContent = result.email;

                    const variant = document.createElement("span");
                    variant.className = "variant-result";
                    variant.textContent = `V${result.variant}`;

                    const status = document.createElement("span");
                    status.className =
                        result.status === "Sent"
                            ? "tag-sent"
                            : "tag-failed";
                    status.textContent = result.status;

                    item.appendChild(email);
                    item.appendChild(variant);
                    item.appendChild(status);
                    resultsList.appendChild(item);
                }

            } catch (error) {
                failed++;
                notSentCount.textContent = failed;

                const item = document.createElement("div");
                item.className = "result-item";

                const email = document.createElement("span");
                email.className = "result-email";
                email.textContent = recipient;

                const variant = document.createElement("span");
                variant.className = "variant-result";
                variant.textContent = "—";

                const status = document.createElement("span");
                status.className = "tag-failed";
                status.textContent = "Failed";

                item.appendChild(email);
                item.appendChild(variant);
                item.appendChild(status);
                resultsList.appendChild(item);
            }

            if (index < recipients.length - 1) {
                let remaining = 10;

                for (let seconds = remaining; seconds > 0; seconds--) {
                    progress.innerHTML = `
                        <strong>Status:</strong>
                        <span>Completed ${index + 1} / ${recipients.length} — next email in ${seconds}s</span>
                    `;
                    await new Promise(resolve => setTimeout(resolve, 1000));
                }
            }
        }

        progress.innerHTML = `
            <strong>Status:</strong>
            <span>Completed — ${recipients.length} processed</span>
        `;

        // Clear recipients only after the entire batch is finished.
        document.getElementById("sendTo").value = "";

    } catch (error) {
        progress.innerHTML = `
            <strong>Status:</strong>
            <span class="tag-failed">Sending failed</span>
        `;
        alert(error.message || "Unable to send emails.");
    } finally {
        sendBtn.disabled = false;
        sendBtn.textContent = "SEND EMAILS";
    }
}
</script>

</body>
</html>
